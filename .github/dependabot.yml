version: 2
updates:
  - package-ecosystem: "bun"  # /package has bun.lock, not package-lock.json
    directory: "/package"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
